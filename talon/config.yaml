name: Talon
version: "1.0.0"
slug: talon
description: Source-built Talon with Codex CLI and a management terminal.
arch:
  - amd64
startup: application
boot: auto
timeout: 60
init: false
ingress: true
ingress_port: 7681
panel_icon: mdi:console
map: []
options:
  instance: ""
  storage_path: ""
  # Trusted HTTP(S) origins for Telegram attachment downloads.
  attachment_allowed_origins: []
schema:
  instance: str
  storage_path: str
  # Requires Talon attachment-origin support.
  attachment_allowed_origins:
    - str
