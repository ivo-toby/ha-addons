name: Talon Home Assistant add-on validation

on:
  push:
    branches:
      - feat/talon-home-assistant-addon
    paths:
      - 'talon/**'
      - '.github/workflows/talon-validation.yml'
  pull_request:
    paths:
      - 'talon/**'
      - '.github/workflows/talon-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate shell and JavaScript
        run: |
          sh -n talon/run.sh
          node --check talon/check-config.cjs
          node --check talon/ingress-proxy.cjs
          node --check talon/prepare-voice-web.cjs
          node --check talon/sync-attachment-origins.cjs
          node --test talon/*.test.cjs

  addon-image:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image locally without publishing
        uses: docker/build-push-action@v6
        with:
          context: ./talon
          file: ./talon/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: talon-haos:ha-check
      - name: Build previous Talon revision for upgrade and rollback checks
        uses: docker/build-push-action@v6
        with:
          context: ./talon
          file: ./talon/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: talon-haos:previous-check
          build-args: |
            TALON_GIT_REF=338ce66f5ed63df5b5961a837da602aa8ebcdfd0
            BUILD_VERSION=1.0.2
      - name: Smoke-test fresh image
        run: python3 talon/smoke-image.py talon-haos:ha-check
      - name: Smoke-test workspace upgrade and backup restore
        run: python3 talon/smoke-image.py talon-haos:ha-check talon-haos:previous-check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/talon-browser" --no-save playwright@1.62.1
          "$RUNNER_TEMP/talon-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test voice login and real browser audio through ingress fixture
        run: NODE_PATH="$RUNNER_TEMP/talon-browser/node_modules" python3 talon/smoke-voice.py talon-haos:ha-check
